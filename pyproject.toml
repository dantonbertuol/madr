[project]
name = "madr"
version = "0.1.0"
description = "Acervo digital de romances"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.17.0",
    "fastapi[standard]==0.120.0",
    "psycopg[binary]==3.2.11",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings==2.11.0",
    "pyjwt>=2.10.1",
    "sqlalchemy[asyncio]==2.0.44",
]

[tool.ruff]
line-length = 120
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'double'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
asyncio_default_fixture_loop_scope = 'function'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev madr/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=madr -vv'
post_test = 'coverage html'

[tool.coverage.run]
concurrency = ["thread", "greenlet"]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.2",
    "taskipy>=1.14.1",
    "testcontainers>=4.13.2",
]
